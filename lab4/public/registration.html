<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration | BrightPath Tuition Classes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#1f2937;min-height:100vh}
nav{background:#172554;color:white;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font-size:24px;font-weight:bold}.logo span{color:#60a5fa}
nav ul{display:flex;gap:22px;list-style:none;flex-wrap:wrap}nav a{color:white;text-decoration:none;font-weight:500}nav a:hover{color:#93c5fd}
.container{max-width:850px;margin:45px auto;padding:0 20px}
.card{background:white;padding:35px;border-radius:18px;box-shadow:0 8px 25px #00000012}
h1{text-align:center;color:#172554;margin-bottom:10px}.intro{text-align:center;color:#64748b;margin-bottom:28px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{font-weight:bold;display:block;margin-bottom:7px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
.full{grid-column:1/-1}.btn{border:0;background:#2563eb;color:white;padding:13px 25px;border-radius:8px;font-size:16px;cursor:pointer}
.center{text-align:center;margin-top:25px}
footer{margin-top:60px;background:#172554;color:white;text-align:center;padding:25px}
.social{margin:12px 0}.social a{color:white;margin:0 10px;font-size:22px;text-decoration:none}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}nav{flex-direction:column}.full{grid-column:auto}}
</style>
</head>
<body>
<nav><div class="logo">Bright<span>Path</span></div><ul>
<li><a href="registration.html">Registration</a></li><li><a href="login.html">Login</a></li><li><a href="courses.html">Courses</a></li><li><a href="feedback.html">Feedback</a></li><li><a href="prizes.html">Prize Details</a></li>
</ul></nav>
<div class="container"><div class="card">
<h1>Student Registration</h1><p class="intro">Join BrightPath Tuition Classes and start learning today.</p>
<form><div class="form-grid">
<div><label>Student Name</label><input type="text" placeholder="Enter your name"></div>
<div><label>Email</label><input type="email" placeholder="Enter email"></div>
<div><label>Mobile Number</label><input type="tel" placeholder="Enter mobile number"></div>
<div><label>Class</label><select><option>Select class</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></select></div>
<div><label>Password</label><input type="password" placeholder="Create password"></div>
<div><label>Subject</label><select><option>Select subject</option><option>Mathematics</option><option>Science</option><option>English</option><option>Computer Science</option></select></div>
<div class="full"><label>Address</label><input type="text" placeholder="Enter your address"></div>
</div><div class="center"><button class="btn" type="submit">Register Now</button></div></form>
</div></div>
<footer><p>© 2026 BrightPath Tuition Classes</p><div class="social"><a href="#" aria-label="Instagram">📷</a><a href="#" aria-label="Facebook">f</a><a href="#" aria-label="YouTube">▶</a><a href="#" aria-label="WhatsApp">☎</a></div><p>Learn • Grow • Succeed</p></footer>
</body></html>
